# Generated into Tappy.xcodeproj by XcodeGen: `brew install xcodegen && xcodegen generate`.
# The .xcodeproj is deliberately NOT committed — three people editing a .pbxproj by hand
# produces merge conflicts nobody can read.
name: Tappy
options:
  bundleIdPrefix: com.tappy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TappyKit:
    path: TappyKit

targets:
  Tappy:
    type: application
    platform: iOS
    sources:
      - path: Tappy
    dependencies:
      - package: TappyKit
        product: TappyKit
    info:
      path: Tappy/Info.plist
      properties:
        CFBundleDisplayName: Tappy
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Required, or LocalAuthentication crashes the app the moment it asks for a face.
        NSFaceIDUsageDescription: Tappy uses Face ID to approve transactions with the key stored in this iPhone's Secure Enclave.
        # The hub runs on a laptop on the same Wi-Fi over plain HTTP. This permits exactly that
        # and nothing else — it is not NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Tappy talks to the wallet hub running on your computer over this network.
    settings:
      base:
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.tappy.app
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
