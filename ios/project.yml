# Generated into Tappy.xcodeproj by XcodeGen: `brew install xcodegen && xcodegen generate`.
# The .xcodeproj is deliberately NOT committed — three people editing a .pbxproj by hand
# produces merge conflicts nobody can read.
name: Tappy
options:
  bundleIdPrefix: com.tappy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TappyKit:
    path: TappyKit

targets:
  Tappy:
    type: application
    platform: iOS
    sources:
      - path: Tappy
    dependencies:
      - package: TappyKit
        product: TappyKit
      - target: TappyWidgets
    info:
      path: Tappy/Info.plist
      properties:
        CFBundleDisplayName: Tappy
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Required, or LocalAuthentication crashes the app the moment it asks for a face.
        NSFaceIDUsageDescription: Tappy uses Face ID to approve transactions with the key stored in this iPhone's Secure Enclave.
        # The hub runs on a laptop on the same Wi-Fi over plain HTTP. This permits exactly that
        # and nothing else — it is not NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Tappy talks to the wallet hub running on your computer over this network.
        # Without this the Dynamic Island simply never appears, with no error anywhere.
        NSSupportsLiveActivities: true
    settings:
      base:
        MARKETING_VERSION: "1.0"
        # Bundle IDs are globally unique. com.tappy.app was already taken, so this is
        # namespaced to us. Change the middle segment if you fork this.
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanzander.tappy
        # DEVELOPMENT_TEAM is deliberately NOT pinned. A Personal Team's id is not the one in
        # the certificate's name, and a wrong value fails the build with "No Account for Team".
        # Pick your team once in Xcode ▸ target ▸ Signing & Capabilities after regenerating.
        # To pin it: Xcode ▸ Settings ▸ Accounts ▸ your Apple ID ▸ the 10-char id beside the team.
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

  TappyWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TappyWidgets
    dependencies:
      - package: TappyKit
        product: TappyKit
    info:
      path: TappyWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tappy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanzander.tappy.widgets
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
